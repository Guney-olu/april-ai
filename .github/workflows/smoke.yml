name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: macOS smoke checks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build April AI
        run: swift build

      - name: Computer Use smoke
        run: swift scripts/smoke-computer-use.swift

      - name: Shortcut smoke
        run: swift scripts/smoke-shortcuts.swift

      - name: Coordinate mapping smoke
        run: swift scripts/smoke-coordinate-mapping.swift

      - name: Memory brain smoke
        run: swift scripts/smoke-memory-brain.swift

      - name: Parse Live smoke script
        run: swiftc -parse scripts/smoke-live.swift
